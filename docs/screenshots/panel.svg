<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-15%" r="80%"><stop offset="0%" stop-color="#0c2230"/><stop offset="62%" stop-color="#061018"/></radialGradient>
    <linearGradient id="echo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39d98a" stop-opacity="0.4"/><stop offset="1" stop-color="#39d98a" stop-opacity="0.02"/></linearGradient>
  </defs>
  <rect width="980" height="560" fill="url(#bg)"/>

  <rect width="980" height="54" fill="#061018" opacity="0.8"/>
  <line x1="0" y1="54" x2="980" y2="54" stroke="#15303c"/>
  <g transform="translate(22,16)">
    <path d="M0 6 Q10 0 20 6 T40 6" fill="none" stroke="#39d98a" stroke-width="2" opacity="0.6"/>
    <path d="M0 16 Q10 10 20 16 T40 16" fill="none" stroke="#3bc7e0" stroke-width="2"/>
    <circle cx="36" cy="24" r="3" fill="#ff5470"/>
  </g>
  <text x="76" y="28" font-size="19" font-weight="700" letter-spacing="4" fill="#dfe8ec">fathom</text>
  <text x="180" y="28" font-size="11" fill="#6b8793">coverage-guided fuzzing</text>
  <text x="640" y="34" font-size="11" fill="#6b8793">./pkg · 10s/target</text>
  <rect x="868" y="14" width="92" height="26" rx="6" fill="none" stroke="#15303c"/>
  <text x="914" y="31" text-anchor="middle" font-size="11" fill="#dfe8ec">new campaign</text>

  <g transform="translate(0,54)">
    <rect width="980" height="48" fill="#061018" opacity="0.4"/>
    <line x1="0" y1="48" x2="980" y2="48" stroke="#15303c"/>
    <g font-size="11" fill="#6b8793">
      <text x="24" y="20" font-size="17" fill="#dfe8ec">2.3M</text><text x="24" y="36">execs</text>
      <text x="120" y="20" font-size="17" fill="#39d98a">108k</text><text x="120" y="36">exec/s</text>
      <text x="220" y="20" font-size="17" fill="#dfe8ec">42</text><text x="220" y="36">corpus</text>
      <text x="300" y="20" font-size="17" fill="#dfe8ec">2</text><text x="300" y="36">targets</text>
      <text x="370" y="20" font-size="17" fill="#ff5470">1</text><text x="370" y="36">crashes</text>
    </g>
    <text x="900" y="30" text-anchor="end" font-size="11" letter-spacing="2" fill="#3bc7e0">RUNNING</text>
  </g>

  <!-- echogram -->
  <g transform="translate(0,102)">
    <rect width="620" height="190" fill="#081620"/>
    <line x1="0" y1="47" x2="620" y2="47" stroke="#15303c"/><line x1="0" y1="95" x2="620" y2="95" stroke="#15303c"/><line x1="0" y1="142" x2="620" y2="142" stroke="#15303c"/>
    <path d="M0 190 L0 150 Q40 120 80 140 T160 110 T240 135 T320 95 T400 120 T480 80 T560 110 T620 90 L620 190 Z" fill="url(#echo)"/>
    <path d="M0 150 Q40 120 80 140 T160 110 T240 135 T320 95 T400 120 T480 80 T560 110 T620 90" fill="none" stroke="#39d98a" stroke-width="1.6"/>
    <line x1="0" y1="190" x2="620" y2="190" stroke="#15303c"/>
  </g>

  <!-- target cards -->
  <g transform="translate(16,308)">
    <rect width="286" height="96" rx="10" fill="#0b1a24" stroke="#15303c"/>
    <text x="16" y="26" font-size="13" fill="#dfe8ec">FuzzChecksum</text>
    <rect x="200" y="12" width="70" height="18" rx="9" fill="#39d98a" opacity="0.14"/>
    <text x="235" y="25" text-anchor="middle" font-size="9" fill="#39d98a">RUNNING</text>
    <text x="16" y="52" font-size="12" fill="#39d98a" letter-spacing="-1">▂▃▃▄▅▅▆▇▆▇██▇█</text>
    <text x="16" y="78" font-size="11" fill="#6b8793">execs <tspan fill="#3bc7e0">2.3M</tspan>   exec/s <tspan fill="#3bc7e0">108k</tspan>   corpus <tspan fill="#3bc7e0">40</tspan></text>
  </g>
  <g transform="translate(318,308)">
    <rect width="286" height="96" rx="10" fill="#0b1a24" stroke="#ff5470"/>
    <text x="16" y="26" font-size="13" fill="#dfe8ec">FuzzParseRecords</text>
    <rect x="210" y="12" width="60" height="18" rx="9" fill="#ff5470" opacity="0.16"/>
    <text x="240" y="25" text-anchor="middle" font-size="9" fill="#ff5470">CRASH</text>
    <text x="16" y="52" font-size="12" fill="#39d98a" letter-spacing="-1">▇█▁</text>
    <text x="16" y="78" font-size="11" fill="#6b8793">execs <tspan fill="#3bc7e0">9</tspan>   exec/s <tspan fill="#3bc7e0">0</tspan>   corpus <tspan fill="#3bc7e0">2</tspan></text>
  </g>

  <!-- crash contacts -->
  <g transform="translate(620,102)">
    <rect width="360" height="458" fill="#081620"/>
    <line x1="0" y1="0" x2="0" y2="458" stroke="#15303c"/>
    <text x="18" y="30" font-size="11" letter-spacing="1.5" fill="#6b8793">CRASH CONTACTS</text>
    <text x="342" y="30" text-anchor="end" font-size="11" fill="#6b8793">1</text>
    <line x1="0" y1="44" x2="360" y2="44" stroke="#15303c"/>
    <g transform="translate(18,44)">
      <text x="0" y="28" font-size="12.5" fill="#ff5470">runtime error: slice bounds out of</text>
      <text x="0" y="46" font-size="12.5" fill="#ff5470">range [N] with capacity N</text>
      <text x="0" y="66" font-size="10.5" fill="#6b8793">FuzzParseRecords · ×1</text>
      <line x1="-18" y1="86" x2="342" y2="86" stroke="#15303c" stroke-opacity="0.6"/>
    </g>
  </g>
</svg>
